# Render Blueprint for the Echo backend (Docker web service).
# Secrets are marked sync: false, so Render asks for them in the dashboard.
services:
  - type: web
    name: echo-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEYS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LLM_MODEL
        value: gemini/gemini-3.5-flash-lite
      - key: LLM_KEY_MODELS
        value: gemini/gemini-3.5-flash-lite,gemini/gemini-3.5-flash-lite,groq/openai/gpt-oss-120b
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: CACHE_TYPE
        value: disk
      - key: CACHE_DIR
        value: /data/llm_cache
