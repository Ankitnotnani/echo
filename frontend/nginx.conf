server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets and the orb media never change: cache for a year.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location /orb/    { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

    # Runtime config and the HTML shell must always be fresh.
    location = /env.js     { add_header Cache-Control "no-store"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # Single-page app fallback.
    location / { try_files $uri $uri/ /index.html; }
}
